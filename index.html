<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股飆股篩選器 - Wood Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f9fa; --surface: #ffffff; --surface-raised: #f1f3f5;
    --border: #e5e7eb; --border-hover: #d1d5db;
    --text: #111827; --text-secondary: #6b7280; --text-tertiary: #9ca3af;
    --accent: #059669; --accent-muted: rgba(5,150,105,0.08);
    --up: #16a34a; --up-bg: rgba(22,163,74,0.08);
    --down: #dc2626; --down-bg: rgba(220,38,38,0.08);
    --gold: #d97706; --gold-bg: rgba(217,119,6,0.08);
    --radius: 8px; --radius-lg: 12px;
    --transition: 0.2s cubic-bezier(0.16,1,0.3,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans TC','Outfit',-apple-system,sans-serif;
    font-size:14px; line-height:1.5; min-height:100vh;
    padding:32px 24px 48px;
    -webkit-font-smoothing:antialiased;
  }
  .container { max-width:1340px; margin:0 auto; }

  /* Header */
  .site-header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:12px; }
  .site-title { font-family:'Outfit',sans-serif; font-size:22px; font-weight:700; letter-spacing:-0.3px; }
  .site-title span { color:var(--accent); }
  .site-meta { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .clock-wrap { display:flex; align-items:baseline; gap:10px; }
  #clock { font-family:'Outfit',monospace; font-size:26px; font-weight:700; color:var(--text); letter-spacing:0.5px; }
  #clockSec { font-family:'Outfit',monospace; font-size:15px; font-weight:500; color:var(--text-secondary); }
  #marketStatus {
    font-size:12px; font-weight:600; padding:4px 12px; border-radius:var(--radius);
    letter-spacing:0.5px;
  }
  .status-pre { background:#dbeafe; color:#1d4ed8; }
  .status-open { background:rgba(22,163,74,0.12); color:#15803d; animation:pulse-status 2s infinite; }
  .status-closed { background:var(--surface-raised); color:var(--text-secondary); }
  .status-off { background:rgba(220,38,38,0.08); color:#b91c1c; }
  @keyframes pulse-status { 0%,100%{opacity:1} 50%{opacity:0.55} }
  .meta-badge { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:4px 12px; font-size:12px; }

  /* Search */
  .search-section { margin-bottom:24px; position:relative; }
  .search-wrap { position:relative; max-width:480px; }
  .search-wrap input {
    width:100%; padding:10px 16px 10px 40px;
    border:1px solid var(--border); border-radius:var(--radius);
    background:var(--surface); color:var(--text); font-size:14px;
    font-family:inherit; outline:none; transition:var(--transition);
  }
  .search-wrap input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-muted); }
  .search-wrap input::placeholder { color:var(--text-tertiary); }
  .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); font-size:16px; }
  .search-dropdown {
    display:none; position:absolute; top:44px; left:0; right:0; max-height:340px; overflow-y:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:0 12px 40px rgba(0,0,0,0.12); z-index:100;
  }
  .search-dropdown.show { display:block; }
  .search-item {
    display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer;
    border-bottom:1px solid var(--border); transition:background var(--transition);
  }
  .search-item:hover { background:var(--surface-raised); }
  .search-item:last-child { border-bottom:none; }
  .search-item-code { font-family:'Outfit',monospace; font-weight:600; font-size:13px; min-width:64px; }
  .search-item-name { font-size:13px; }
  .search-item-market { margin-left:auto; font-size:11px; padding:2px 8px; border-radius:4px; }
  .market-listed { background:var(--accent-muted); color:var(--accent); }
  .market-otc { background:rgba(59,130,246,0.08); color:#3B82F6; }
  .market-emg { background:rgba(139,92,246,0.08); color:#8B5CF6; }

  /* Stock Detail Card */
  .detail-card {
    display:none; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:20px 24px; margin-bottom:24px;
  }
  .detail-card.show { display:block; }
  .detail-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .detail-name { font-size:18px; font-weight:700; }
  .detail-code { color:var(--text-secondary); font-size:13px; margin-left:8px; font-family:'Outfit',monospace; }
  .detail-industry { font-size:12px; padding:3px 10px; border-radius:4px; color:#fff; display:inline-block; }
  .detail-close { text-align:right; }
  .detail-price { font-size:28px; font-weight:700; font-family:'Outfit',monospace; }
  .detail-change { font-size:14px; margin-top:2px; }
  .detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .detail-item { background:var(--surface-raised); border-radius:var(--radius); padding:12px; }
  .detail-item-label { font-size:11px; color:var(--text-tertiary); margin-bottom:4px; }
  .detail-item-value { font-size:15px; font-weight:600; font-family:'Outfit',monospace; }
  .detail-kline-btn {
    grid-column:1/-1; display:flex; justify-content:flex-end;
  }
  .btn-kline {
    background:var(--accent); color:#fff; border:none; padding:8px 20px;
    border-radius:var(--radius); font-size:13px; font-weight:600; cursor:pointer;
    font-family:inherit; transition:var(--transition);
  }
  .btn-kline:hover { opacity:0.88; }

  /* Stats row */
  .stats-row { display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  .stat-card {
    flex:1; min-width:140px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:16px 20px;
  }
  .stat-label { font-size:12px; color:var(--text-tertiary); margin-bottom:4px; }
  .stat-value { font-size:22px; font-weight:700; font-family:'Outfit',monospace; }

  /* Industry Chart */
  .chart-section { margin-bottom:24px; }
  .section-title { font-size:15px; font-weight:600; margin-bottom:12px; }
  .bar-chart { display:flex; flex-direction:column; gap:6px; }
  .bar-row {
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:3px 6px; border-radius:6px; transition:background var(--transition);
  }
  .bar-row:hover { background:var(--surface-raised); }
  .bar-label { width:80px; font-size:12px; text-align:right; color:var(--text-secondary); flex-shrink:0; }
  .bar-track { flex:1; height:24px; background:var(--surface-raised); border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; transition:width 0.6s var(--transition); display:flex; align-items:center; padding-left:8px; }
  .bar-count { color:#fff; font-size:11px; font-weight:600; font-family:'Outfit',monospace; }
  .bar-count-out {
    width:32px; font-size:12px; font-weight:600; color:var(--text-secondary); flex-shrink:0;
    font-family:'Outfit',monospace;
  }

  /* Industry Detail Panel */
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:200; }
  .overlay.show { display:block; }
  .ind-panel {
    display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:90vw; max-width:900px; max-height:80vh;
    background:var(--surface); border-radius:var(--radius-lg);
    box-shadow:0 24px 80px rgba(0,0,0,0.2); z-index:201;
    overflow:hidden;
  }
  .ind-panel-head {
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px; border-bottom:1px solid var(--border);
  }
  .ind-panel-title { font-size:16px; font-weight:700; }
  .ind-panel-close {
    background:none; border:none; font-size:20px; cursor:pointer;
    color:var(--text-secondary); padding:4px 8px; border-radius:4px;
  }
  .ind-panel-close:hover { background:var(--surface-raised); color:var(--text); }
  .ind-panel-body { flex:1; overflow-y:auto; padding:12px 20px 20px; }
  .ind-table { width:100%; border-collapse:collapse; font-size:13px; }
  .ind-table th {
    background:var(--surface-raised); padding:8px 10px; text-align:left;
    font-size:11px; color:var(--text-secondary); border-bottom:2px solid var(--border);
    position:sticky; top:0; z-index:1;
  }
  .ind-table th.right { text-align:right; }
  .ind-table td { padding:8px 10px; border-bottom:1px solid var(--border); }
  .ind-table td.right { text-align:right; font-family:'Outfit',monospace; }
  .ind-table tr:hover td { background:var(--surface-raised); cursor:pointer; }
  .ind-table .ind-code { font-family:'Outfit',monospace; font-weight:600; }
  .ind-kline-btn {
    background:var(--accent); color:#fff; border:none; padding:3px 12px;
    border-radius:4px; font-size:11px; cursor:pointer; font-family:inherit;
  }

  /* K-line Modal */
  .kline-modal {
    display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:94vw; max-width:1100px; height:85vh;
    background:var(--surface); border-radius:var(--radius-lg);
    box-shadow:0 24px 80px rgba(0,0,0,0.25); z-index:202;
    flex-direction:column; overflow:hidden;
  }
  .kline-modal.show { display:flex; }
  .kline-head {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 20px; border-bottom:1px solid var(--border);
  }
  .kline-title { font-size:16px; font-weight:700; }
  .kline-intervals { display:flex; gap:4px; flex-wrap:wrap; }
  .kline-interval {
    background:var(--surface-raised); border:1px solid var(--border);
    border-radius:4px; padding:4px 10px; font-size:11px; cursor:pointer;
    font-family:inherit; color:var(--text-secondary); transition:var(--transition);
  }
  .kline-interval:hover { border-color:var(--accent); color:var(--accent); }
  .kline-interval.active {
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  .kline-close {
    background:none; border:none; font-size:20px; cursor:pointer;
    color:var(--text-secondary); padding:4px 8px; border-radius:4px;
  }
  .kline-close:hover { background:var(--surface-raised); color:var(--text); }
  .kline-chart { flex:1; min-height:0; }

  /* Table */
  .table-wrap { overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:var(--surface-raised); padding:10px 12px; text-align:left; font-weight:500; color:var(--text-secondary); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; border-bottom:2px solid var(--border); }
  th.align-right { text-align:right; }
  td { padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td.align-right { text-align:right; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:var(--surface-raised); }
  .cell-code { font-family:'Outfit',monospace; font-weight:600; }
  .cell-name { font-weight:500; }
  .cell-industry { font-size:11px; }
  .cell-industry span { padding:2px 8px; border-radius:4px; color:#fff; font-size:11px; }
  .cell-price { font-family:'Outfit',monospace; font-weight:500; }
  .cell-up { color:var(--up); font-weight:600; }
  .cell-down { color:var(--down); font-weight:600; }
  .cell-score { font-family:'Outfit',monospace; font-weight:700; font-size:15px; display:inline-block; min-width:32px; text-align:center; }
  .cell-score-wrap { text-align:right; }
  .cell-score.hot { color:#dc2626; }
  .cell-score.warm { color:#d97706; }
  .cell-score.cool { color:var(--text-secondary); }
  .cell-flags { max-width:200px; overflow:hidden; text-overflow:ellipsis; color:var(--text-secondary); font-size:12px; }

  /* Footer */
  .site-footer { margin-top:32px; text-align:center; font-size:11px; color:var(--text-tertiary); }

  @media (max-width:768px) {
    body { padding:16px 12px 32px; }
    #clock { font-size:20px; }
    .stats-row { gap:8px; }
    .stat-card { padding:12px 14px; }
    .stat-value { font-size:18px; }
    .search-wrap { max-width:100%; }
    .bar-label { width:60px; font-size:11px; }
    .detail-grid { grid-template-columns:repeat(2,1fr); }
    .ind-panel { width:96vw; max-height:90vh; }
    .kline-modal { width:98vw; height:90vh; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="site-header">
    <div class="site-title"><span>台股飆股</span>篩選器</div>
    <div class="site-meta">
      <div class="clock-wrap">
        <span id="clock"></span><span id="clockSec"></span>
      </div>
      <span id="marketStatus"></span>
      <span class="meta-badge" id="updateBadge"></span>
    </div>
  </header>

  <!-- Search -->
  <div class="search-section">
    <div class="search-wrap">
      <span class="search-icon">&#x1F50D;</span>
      <input type="text" id="searchInput" placeholder="輸入股票代號或名稱查詢（例如 2330、台積電、0050）" autocomplete="off">
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
  </div>

  <!-- Detail Card -->
  <div class="detail-card" id="detailCard">
    <div class="detail-header">
      <div>
        <span class="detail-name" id="detailName"></span>
        <span class="detail-code" id="detailCode"></span>
        <span class="detail-industry" id="detailIndustry" style="margin-left:8px;"></span>
      </div>
      <div class="detail-close">
        <div class="detail-price" id="detailPrice"></div>
        <div class="detail-change" id="detailChange"></div>
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-item"><div class="detail-item-label">MA5</div><div class="detail-item-value" id="dMA5">-</div></div>
      <div class="detail-item"><div class="detail-item-label">MA10</div><div class="detail-item-value" id="dMA10">-</div></div>
      <div class="detail-item"><div class="detail-item-label">MA20</div><div class="detail-item-value" id="dMA20">-</div></div>
      <div class="detail-item"><div class="detail-item-label">MA60</div><div class="detail-item-value" id="dMA60">-</div></div>
      <div class="detail-item"><div class="detail-item-label">52週高</div><div class="detail-item-value" id="dHigh52">-</div></div>
      <div class="detail-item"><div class="detail-item-label">52週低</div><div class="detail-item-value" id="dLow52">-</div></div>
      <div class="detail-item"><div class="detail-item-label">成交量</div><div class="detail-item-value" id="dVolume">-</div></div>
      <div class="detail-item"><div class="detail-item-label">市場</div><div class="detail-item-value" id="dMarket">-</div></div>
      <div class="detail-kline-btn">
        <button class="btn-kline" id="detailKlineBtn" onclick="openKline(currentDetailCode)">K線圖</button>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">掃描總數</div><div class="stat-value" id="statTotal">-</div></div>
    <div class="stat-card"><div class="stat-label">篩出飆股</div><div class="stat-value" style="color:var(--accent)" id="statMatched">-</div></div>
    <div class="stat-card"><div class="stat-label">全市場數據</div><div class="stat-value" style="color:#3B82F6" id="statAll">-</div></div>
  </div>

  <!-- Industry Chart -->
  <div class="chart-section">
    <div class="section-title">產業分布（點擊查看該產業所有股票）</div>
    <div class="bar-chart" id="barChart"></div>
  </div>

  <!-- Table -->
  <div class="section-title">飆股列表</div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>代號</th><th>名稱</th><th>產業</th>
        <th class="align-right">收盤價</th>
        <th class="align-right">漲跌</th>
        <th class="align-right">幅度</th>
        <th class="align-right">MA5</th>
        <th class="align-right">MA20</th>
        <th class="align-right">成交量</th>
        <th class="align-right">評分</th>
        <th>判斷依據</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="site-footer">Wood Studio &copy; 2026 · 資料來源: TWSE / TPEx / Yahoo Finance</div>
</div>

<!-- Overlay for panels -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- Industry Panel -->
<div class="ind-panel" id="indPanel">
  <div class="ind-panel-head">
    <div class="ind-panel-title" id="indPanelTitle"></div>
    <button class="ind-panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="ind-panel-body" id="indPanelBody"></div>
</div>

<!-- K-line Modal -->
<div class="kline-modal" id="klineModal">
  <div class="kline-head">
    <div class="kline-title" id="klineTitle"></div>
    <div class="kline-intervals" id="klineIntervals"></div>
    <button class="kline-close" onclick="closeKline()">✕</button>
  </div>
  <div class="kline-chart" id="klineChart"></div>
</div>

// === Clock + Market Status ===
function getDateStr(d) {
  var y = d.getFullYear();
  var m = ('0'+(d.getMonth()+1)).slice(-2);
  var dd = ('0'+d.getDate()).slice(-2);
  return y+'-'+m+'-'+dd;
}

function updateStatus() {
  var n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleString('zh-TW', {hour:'2-digit',minute:'2-digit',hour12:false});
  document.getElementById('clockSec').textContent =
    n.toLocaleString('zh-TW', {second:'2-digit',hour12:false});

  var statusEl = document.getElementById('marketStatus');
  var dow = n.getDay();
  var dateStr = getDateStr(n);
  var hour = n.getHours();
  var minute = n.getMinutes();

  if (dow === 0 || dow === 6) {
    statusEl.textContent = '休市';
    statusEl.className = 'status-off';
  } else if (HOLIDAYS.indexOf(dateStr) !== -1) {
    statusEl.textContent = '國定假日休市';
    statusEl.className = 'status-off';
  } else if (hour < 9) {
    statusEl.textContent = '準備開盤';
    statusEl.className = 'status-pre';
  } else if (hour === 9 && minute === 0) {
    statusEl.textContent = '交易中';
    statusEl.className = 'status-open';
  } else if (hour > 13 || (hour === 13 && minute >= 30)) {
    if (hour < 22) {
      statusEl.textContent = '已收盤';
    } else {
      statusEl.textContent = '休市';
    }
    statusEl.className = 'status-closed';
  } else {
    statusEl.textContent = '交易中';
    statusEl.className = 'status-open';
  }
}

// Helper: 取得股票完整資訊
function getStockInfo(code) {
  return LOOKUP.stocks.find(function(s) { return s.code === code; });
}

// Helper: 格式化成交量
function fmtVol(v) {
  return v >= 1000000 ? (v/1000000).toFixed(1)+'M'
    : v >= 1000 ? (v/1000).toFixed(0)+'K' : String(v);
}

// === Bar Chart ===
(function() {
  var dist = SCREENER.industry_distribution || [];
  var maxCount = Math.max.apply(null, dist.map(function(d){return d.count;}).concat([1]));
  var barChart = document.getElementById('barChart');

  barChart.innerHTML = dist.map(function(d) {
    var pct = (d.count/maxCount*100).toFixed(0);
    var color = industryColors[d.name] || '#6B7280';
    return '<div class="bar-row" onclick="openIndustry(''+d.name+'')" data-industry="'+d.name+'">' +

      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'">' +
      '<span class="bar-count">'+d.count+'</span></div></div>' +
      '<div class="bar-count-out">'+d.count+'</div></div>';
  }).join('');
})();

// === Table ===

// === Search ===
(function() {
  var allStocks = LOOKUP.stocks || [];
  var input = document.getElementById('searchInput');
  var dropdown = document.getElementById('searchDropdown');
  var card = document.getElementById('detailCard');

  function search(q) {
    if (!q || q.length < 1) { dropdown.classList.remove('show'); return; }
    var lower = q.toLowerCase();
    var results = allStocks.filter(function(s) {
      return s.code.indexOf(q) === 0 || s.name.toLowerCase().indexOf(lower) !== -1;
    }).slice(0, 20);
    if (results.length === 0) { dropdown.classList.remove('show'); return; }

    dropdown.innerHTML = results.map(function(s) {
      var mktCls = s.market === '上市' ? 'market-listed' : s.market === '上櫃' ? 'market-otc' : 'market-emg';
      return '<div class="search-item" data-code="'+s.code+'">' +
        '<span class="search-item-code">'+s.code+'</span>' +
        '<span class="search-item-name">'+s.name+'</span>' +
        '<span class="search-item-market '+mktCls+'">'+s.market+'</span></div>';
    }).join('');
    dropdown.classList.add('show');
  }

  window.showDetail = function(code) {
    currentDetailCode = code;
    var s = getStockInfo(code);
    if (!s) return;
    var color = industryColors[s.industry] || '#6B7280';
    document.getElementById('detailName').textContent = s.name;
    document.getElementById('detailCode').textContent = s.code;
    document.getElementById('detailIndustry').textContent = s.industry;
    document.getElementById('detailIndustry').style.background = color;
    document.getElementById('detailPrice').textContent = s.close;
    var ch = document.getElementById('detailChange');
    var sign = s.change_pct >= 0 ? '+' : '';
    ch.textContent = sign + s.change_amount + ' / ' + sign + s.change_pct + '%';
    ch.style.color = s.change_pct >= 0 ? 'var(--up)' : 'var(--down)';
    document.getElementById('dMA5').textContent = s.ma5 != null ? s.ma5 : '-';
    document.getElementById('dMA10').textContent = s.ma10 != null ? s.ma10 : '-';
    document.getElementById('dMA20').textContent = s.ma20 != null ? s.ma20 : '-';
    document.getElementById('dMA60').textContent = s.ma60 != null ? s.ma60 : '-';
    document.getElementById('dHigh52').textContent = s.high52;
    document.getElementById('dLow52').textContent = s.low52;
    document.getElementById('dVolume').textContent = fmtVol(s.volume);
    document.getElementById('dMarket').textContent = s.market;
    document.getElementById('detailKlineBtn').style.display = '';
    card.classList.add('show');
    card.scrollIntoView({behavior:'smooth',block:'start'});
  };

  input.addEventListener('input', function() { search(this.value); });
  input.addEventListener('focus', function() { if (this.value) search(this.value); });

  dropdown.addEventListener('click', function(e) {
    var item = e.target.closest('.search-item');
    if (!item) return;
    input.value = item.dataset.code;
    dropdown.classList.remove('show');
    showDetail(item.dataset.code);
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-section')) dropdown.classList.remove('show');
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { dropdown.classList.remove('show'); input.blur(); }
    if (e.key === 'Enter') {
      var q = input.value.trim();
      if (q) {
        var match = allStocks.find(function(s){return s.code===q;});
        if (match) { dropdown.classList.remove('show'); showDetail(q); }
      }
    }
  });
})();

    + indName + '（'+filtered.length+' 檔）';

    '<th class="right">收盤價</th><th class="right">漲跌</th><th class="right">幅度</th>' +

    html += '<tr onclick="event.stopPropagation();showDetail(''+s.code+'');closePanel();">' +
      '<td class="ind-code">'+s.code+'</td>' +
      '<td>'+s.name+'</td><td>'+s.market+'</td>' +

      '<td class="right '+chCls+'">'+sign+s.change_pct+'%</td>' +
      '<td><button class="ind-kline-btn" onclick="event.stopPropagation();closePanel();openKline(''+s.code+'')">K線</button></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  bodyEl.innerHTML = html;

  document.getElementById('overlay').classList.add('show');

  panel.style.display = 'flex';
  panel.style.flexDirection = 'column';

// === K-line Chart ===
var klineChart = null;
var klineSeries = null;
var klineCode = null;

// K-line intervals config
var INTERVALS = [
  {label:'1分', src:'intraday', bars:60},
  {label:'5分', src:'intraday', bars:65},
  {label:'10分', src:'intraday', bars:60},
  {label:'30分', src:'intraday', bars:60},
  {label:'60分', src:'intraday', bars:60},
  {label:'1日', src:'daily', bars:60},
  {label:'3日', src:'daily', bars:30},
  {label:'5日', src:'daily', bars:22},
  {label:'1週', src:'daily', bars:25},
  {label:'15天', src:'daily', bars:15},
  {label:'3週', src:'daily', bars:15},
  {label:'30天', src:'daily', bars:30},
];
var currentIntervalIdx = 5; // default: 1日

function getKlineData(code, src) {
  var store = src === 'intraday' ? KLINE_INTRADAY : KLINE_DAILY;
  return store[code] || null;
}

function buildCandles(raw, maxBars) {
  if (!raw) return [];
  var len = raw.t.length;
  var start = Math.max(0, len - maxBars);
  var candles = [];
  var isIntra = typeof raw.t[0] === 'number';
  for (var i = start; i < len; i++) {
    candles.push({
      time: isIntra ? raw.t[i] : raw.t[i],
      open: raw.o[i], high: raw.h[i], low: raw.l[i], close: raw.c[i],
      volume: raw.v[i]
    });
  }
  return candles;
}

window.openKline = function(code) {
  klineCode = code;
  currentIntervalIdx = 5; // default 1日
  var s = getStockInfo(code);
  var title = code;
  if (s) title = code + ' ' + s.name;
  document.getElementById('klineTitle').textContent = title;

  // Interval buttons
  var intvHtml = '';
  INTERVALS.forEach(function(iv, idx) {
    intvHtml += '<button class="kline-interval'+(idx===currentIntervalIdx?' active':'')+
      '" onclick="switchInterval('+idx+')">'+iv.label+'</button>';
  });
  document.getElementById('klineIntervals').innerHTML = intvHtml;

  document.getElementById('overlay').classList.add('show');
  document.getElementById('indPanel').style.display = 'none';
  document.getElementById('klineModal').classList.add('show');

  renderChart(code, currentIntervalIdx);
};

window.switchInterval = function(idx) {
  currentIntervalIdx = idx;
  var btns = document.querySelectorAll('.kline-interval');
  btns.forEach(function(b, i) { b.classList.toggle('active', i===idx); });
  renderChart(klineCode, idx);
};

window.closeKline = function() {
  document.getElementById('klineModal').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  var chartContainer = document.getElementById('klineChart');
  chartContainer.innerHTML = '';
  klineChart = null;
  klineSeries = null;
};

function renderChart(code, intervalIdx) {
  var iv = INTERVALS[intervalIdx];
  var raw = getKlineData(code, iv.src);
  var chartContainer = document.getElementById('klineChart');
  chartContainer.innerHTML = '';

  if (!raw || raw.t.length === 0) {
    chartContainer.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:14px;">該股票暫無 K 線數據</div>';
    return;
  }

  var candles = buildCandles(raw, iv.bars);
  if (candles.length === 0) {
    chartContainer.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:14px;">數據不足</div>';
    return;
  }

  var isIntra = iv.src === 'intraday';

  // Simple Canvas K-line chart
  var canvas = document.createElement('canvas');
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  chartContainer.appendChild(canvas);

  // Wait for layout
  requestAnimationFrame(function() {
    drawKlineCanvas(canvas, candles, code, iv, isIntra);
  });

  // Resize handler
  var ro = new ResizeObserver(function() {
    if (klineCode === code && currentIntervalIdx === intervalIdx) {
      drawKlineCanvas(canvas, candles, code, iv, isIntra);
    }
  });
  ro.observe(chartContainer);
  canvas._ro = ro;
  if (canvas._prevRo) canvas._prevRo.disconnect();
  canvas._prevRo = ro;
}

function drawKlineCanvas(canvas, candles, code, iv, isIntra) {
  var W = canvas.parentElement.clientWidth;
  var H = canvas.parentElement.clientHeight;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  var pad = {top:10, right:60, bottom:40, left:60};
  var pw = W - pad.left - pad.right;
  var ph = H - pad.top - pad.bottom;
  if (pw <= 0 || ph <= 0) return;

  // Price range
  var priceMax = -Infinity, priceMin = Infinity;
  var volMax = 0;
  candles.forEach(function(c) {
    if (c.high > priceMax) priceMax = c.high;
    if (c.low < priceMin) priceMin = c.low;
    if (c.volume > volMax) volMax = c.volume;
  });
  var margin = (priceMax - priceMin) * 0.1 || priceMax * 0.01;
  priceMax += margin;
  priceMin -= margin;
  if (priceMin < 0) priceMin = 0;

  var volHeight = Math.max(40, ph * 0.2);
  var mainHeight = ph - volHeight - 4;

  function toX(i) { return pad.left + (i + 0.5) * (pw / candles.length); }
  function toY(p) { return pad.top + mainHeight - ((p - priceMin) / (priceMax - priceMin)) * mainHeight; }
  function toVY(v) { return pad.top + mainHeight + 4 + volHeight - (v / volMax) * volHeight; }

  // Background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = '#f1f3f5';
  ctx.lineWidth = 1;
  var gridLines = 5;
  for (var g = 0; g <= gridLines; g++) {
    var y = pad.top + (g / gridLines) * mainHeight;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + pw, y); ctx.stroke();
    var price = priceMax - (g / gridLines) * (priceMax - priceMin);
    ctx.fillStyle = '#9ca3af';
    ctx.font = '10px Outfit,sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(price.toFixed(2), pad.left - 6, y + 3);
  }

  // Volume bar chart
  ctx.strokeStyle = '#e5e7eb';
  var vGrid = 2;
  for (var vg = 0; vg <= vGrid; vg++) {
    var vy = pad.top + mainHeight + 4 + (vg / vGrid) * volHeight;
    ctx.beginPath(); ctx.moveTo(pad.left, vy); ctx.lineTo(pad.left + pw, vy); ctx.stroke();
    if (vg < vGrid) {
      ctx.fillStyle = '#9ca3af';
      ctx.textAlign = 'right';
      ctx.fillText(fmtVol((volMax*(1-vg/vGrid))), pad.left - 6, vy + 3);
    }
  }

  // Candles + Volume
  var barW = Math.max(1, Math.min(12, (pw / candles.length) * 0.7));
  candles.forEach(function(c, i) {
    var x = toX(i);
    var isUp = c.close >= c.open;
    var color = isUp ? '#16a34a' : '#dc2626';

    // Candle body
    var bodyTop = toY(Math.max(c.open, c.close));
    var bodyBot = toY(Math.min(c.open, c.close));
    var bodyH = Math.max(1, bodyBot - bodyTop);

    ctx.fillStyle = isUp ? '#16a34a' : '#dc2626';
    ctx.fillRect(x - barW/2, bodyTop, barW, bodyH);

    // Wick
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, toY(c.high));
    ctx.lineTo(x, bodyTop);
    ctx.moveTo(x, bodyBot);
    ctx.lineTo(x, toY(c.low));
    ctx.stroke();

    // Volume bar
    ctx.fillStyle = isUp ? 'rgba(22,163,74,0.25)' : 'rgba(220,38,38,0.25)';
    var vBot = toVY(0);
    var vTop = toVY(c.volume);
    ctx.fillRect(x - barW/2, vTop, barW, Math.max(1, vBot - vTop));
  });

  // Time labels
  var labelStep = Math.max(1, Math.floor(candles.length / 6));
  ctx.fillStyle = '#9ca3af';
  ctx.font = '10px Outfit,sans-serif';
  ctx.textAlign = 'center';
  for (var ti = 0; ti < candles.length; ti += labelStep) {
    var tLabel = '';
    var t = candles[ti].time;
    if (isIntra) {
      var d = new Date(t * 1000);
      tLabel = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    } else {
      var parts = t.split('-');
      tLabel = parts[1]+'/'+parts[2];
    }
    ctx.fillText(tLabel, toX(ti), pad.top + mainHeight + volHeight + 26);
  }

  // Info
  ctx.fillStyle = '#111827';
  ctx.font = '12px Outfit,sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(iv.label + ' K線', pad.left, pad.top - 2);
}

// Close panels on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('klineModal').classList.contains('show')) {
      closeKline();
    } else if (document.getElementById('indPanel').style.display === 'flex') {
      closePanel();
    }
  }
});
